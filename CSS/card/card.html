<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>LoXc</h1>
        <div class="image">
            <img src="./images/shoes-2.jpeg" alt="">
        </div>
        <div class="bio">
            <p>Nike Mens Court Vision Low Basketball Shoes</p>
        </div>
        <div class="info">
            <h2 class="label">Price: </h1>
            <h2 class="cost">103$</h2>
        </div>
        <div class="buttom">
            <div class="buynow">
                <button type="submit">Buynow</button>
                </div>
                <div class="add-to-card">
                    <button type="submit">Add to card</button>
                </div>
                
        </div>
    </div>
</body>
</html>
