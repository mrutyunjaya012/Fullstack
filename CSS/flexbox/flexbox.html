<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: azure;
        }
        h2{
            color: rgb(37, 29, 29);
        }
        .container{
            background-color: antiquewhite;
            border: 2px solid #333;
            margin-bottom: 20px;
            padding: 10px;
        }
        .flex-container{
            display: flex;
            height: 200px;
            margin-bottom: 10px;
        }
        .circular{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin: 5px;
        }
        .pastel-1{
            background-color: brown;
        }
        .pastel-2{
            background-color:chartreuse;
        }
        .pastel-3{
            background-color:chocolate;
        }
        .pastel-4{
            background-color:green;
        }
        .pastel-5{
            background-color:deeppink;
        }
        .pastel-6{
            background-color:dodgerblue;
        }


    </style>
</head>
<body>
    <div class="container">
         <h2>1.Default flex (row)</h2>
        <div class="flex-container">
            <div class="circular pastel-1">1</div>
            <div class="circular pastel-2">2</div>
            <div class="circular pastel-3">3</div>
            <div class="circular pastel-4">4</div>
            <div class="circular pastel-5">5</div>
            <div class="circular pastel-6">6</div>
        </div>
        </div>
        <div class="container">
            <h2>2.Flex direction : column</h2>
        <div class="flex-container" style="flex-direction:column;">
           <div class="circular pastel-1">1</div>
            <div class="circular pastel-2">2</div>
            <div class="circular pastel-3">3</div>
            <div class="circular pastel-4">4</div>
            <div class="circular pastel-5">5</div>
            <div class="circular pastel-6">6</div>
        </div>
        </div>
        <div class="container">
             <h2>3.justify-content: space- between </h2>
            <div class="flex-container" style="justify-content:space-around;">
            <div class="circular pastel-1">1</div>
            <div class="circular pastel-2">2</div>
            <div class="circular pastel-3">3</div>
            <div class="circular pastel-4">4</div>
            <div class="circular pastel-5">5</div>
            <div class="circular pastel-6">6</div>
            
        </div>
        </div> 
        <div class="container" >
            <h2>4.align item : centre</h2>
        <div class="flex-container" style="align-items: center; ">
            <div class="circular pastel-1">1</div>
            <div class="circular pastel-2">2</div>
            <div class="circular pastel-3">3</div>
            <div class="circular pastel-4">4</div>
            <div class="circular pastel-5">5</div>
            <div class="circular pastel-6">6</div>
        </div>
        </div>
        <div class="container">
            <h2>5.flex wrap: wrap</h2>
            <div class="flex-container" style="flex-wrap: wrap;">
            <div class="circular pastel-1">1</div>
            <div class="circular pastel-2">2</div>
            <div class="circular pastel-3">3</div>
            <div class="circular pastel-4">4</div>
            <div class="circular pastel-5">5</div>
            <div class="circular pastel-6">6</div>
            <div class="circular pastel-2">6</div>
            <div class="circular pastel-3">7</div>
            <div class="circular pastel-4">8</div>
            <div class="circular pastel-5">9</div>
            <div class="circular pastel-6">10</div>
        </div>
        </div>
        <div class="container" >
            <h2>6.align content : space- around(with wrap)</h2>
        <div class="flex-container" 
        style="flex-wrap:wrap"
        >
            <div class="circular pastel-1">1</div>
            <div class="circular pastel-2">2</div>
            <div class="circular pastel-3">3</div>
            <div class="circular pastel-4">4</div>
            <div class="circular pastel-5">5</div>
            <div class="circular pastel-6">6</div>
        </div>
        </div>
    </div>
</body>
</html>
