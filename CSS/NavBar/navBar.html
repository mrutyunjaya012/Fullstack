<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0px;
            padding: 20px;
            background-color:beige;
        }
        .nav-container{
            margin-bottom: 10px;
        }
        h2{
            margin-bottom: 20px;
        }
        .nav1{
            background-color: cadetblue;
            padding: 10px;
        }
        .nav1 ul{
            list-style-type:none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        .nav1 li{
            display: inline;
        }
        .nav1 a{
            text-decoration: none;
            color:rgb(7, 7, 236);
            position: relative;
        }
        .nav1 a::after{
            content: "";
            position: absolute;
            height: 2px;
            width: 100%;
            bottom: 0;
            left: 0;
            background-color: brown;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;

        }
        .nav1 a:hover::after{
            transform: scaleX(1);

        }
        .nav1 .login-btn{
            background-color:forestgreen;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        /* nav2 styling */

        .nav2{
            background-color:lightcoral;
            width: 200px;
            padding: 10px;
        }
        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;

        }
        .nav2 li{
            margin-bottom: 12px;
        }
        .nav2 a{
            box-sizing: border-box;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
            width: 100%;
        }
        .nav2 a:hover{
            background-color:indianred;
            color: black;
        }
        .nav2 .login-btn{
            background-color: darkgreen;
            border-radius: 5px;
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }
        .nav2 .login-btn:hover{
            background-color: rgb(20, 205, 20);
        }

        /* navbar 3 */
        .nav3{
            background-color: darkturquoise;
            padding: 10px;
        }
        .nav3 ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav3 a{
            text-decoration: none;
            padding: 5px;
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
            color: aliceblue;
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: rgb(36, 125, 133);
            min-width: 120px;
        }
        .nav3 .login-btn{
            border-radius: 5px;
            background-color: darkgreen;
            height: 30px;
            width: 50px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <div class="nav-container"></div>
    <h2>Variation -1: Horizontal with Underline effects</h2>
    <nav class="nav1">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Contact</a></li>
            <li><button class="login-btn">Login</button></li>
        </ul>
    </nav>
    </div>
    <div class="nav-container">
        <h2>Variation -2: Vertical with hover effects </h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <button class="login-btn">Login</button>
            </ul>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation -2: Horizontal with Dropdown</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropdown">
                    <a href="#">About</a>
                    <div class="dropdown-content">
                        <a href="#">Our Story</a>
                        <a href="#">Team</a>
                        <a href="#">Contact</a>
                    </div>
                    </li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">login</button></a></li>

            </ul>
        </nav>
    </div>
</body>
</html>
