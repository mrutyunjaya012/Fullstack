<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-blue-950 text-cyan-50 flex justify-center items-center min-h-screen ">
    <div class="bg-amber-200 text-black rounded-3xl p-8 shadow-lg max-w-sm w-full">
        <h2 class="text-center text-3xl  mb-6 font-bold ">Login</h2>
        <form action="">
            <div>
                <label class="block text-sm font-medium  mb-2" >Email</label>
                <input class="bg-amber-950 w-full h-10 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-700 text-white" type="email" name="" id="" placeholder="Email">
            </div>
            <div>
                <label for="password">Password</label>
                <input class="bg-amber-950 w-full h-10 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-700 text-white" type="password" name="" id="" placeholder="Password">
            </div>
            <div class="mt-3 mb-1">
                <a href="#">Forget password ?</a>
            </div>
            <button class="items-center bg-green-600 rounded-md font-bold text-black justify-center h-10 w-full   hover:bg-green-800 shadow-2xl" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
